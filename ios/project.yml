name: AIAssistant
options:
  bundleIdPrefix: com.ai.assistant
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "100"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_BITCODE: NO
    DERIVED_DATA_PATH: build
    DEVELOPMENT_TEAM: ""
schemes:
  AIAssistant:
    build:
      targets:
        AIAssistant: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
targets:
  AIAssistant:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ai.assistant
        PRODUCT_NAME: AIAssistant
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "AI 助手"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要相册权限以选择图片附件发送给 AI"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    sources:
      - path: AIAssistant
        excludes:
          - "Info.plist"
    resources:
      - path: AIAssistant/Resources/config.json
      - path: AIAssistant/Resources/Assets.xcassets
