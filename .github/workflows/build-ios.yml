name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen 2>&1

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate 2>&1
          echo "=== Generated files ==="
          ls -la *.xcodeproj/
          echo "=== Project contents ==="
          find . -name "*.swift" -o -name "*.plist" -o -name "*.json" | head -30

      - name: List schemes
        working-directory: ios
        run: |
          xcodebuild -project AIAssistant.xcodeproj -list 2>&1 || true

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          echo "=== Project structure ==="
          ls -la
          echo "=== xcodeproj contents ==="
          ls -la AIAssistant.xcodeproj/ || true
          echo "=== Starting xcodebuild ==="
          xcodebuild clean build \
            -project AIAssistant.xcodeproj \
            -scheme AIAssistant \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 || {
              echo "=== BUILD FAILED with exit code $? ==="
              exit 1
            }

      - name: Create IPA
        if: success()
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AIAssistant.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AIAssistant.ipa Payload

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-ipa
          path: ios/AIAssistant.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          retention-days: 7
