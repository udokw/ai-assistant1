name: Build iOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          echo "=== Generated .xcodeproj ==="
          ls -la AIAssistant.xcodeproj/
          echo "=== Scheme list ==="
          xcodebuild -project AIAssistant.xcodeproj -list

      - name: Build
        working-directory: ios
        run: |
          xcodebuild clean build \
            -project AIAssistant.xcodeproj \
            -scheme AIAssistant \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Create IPA
        if: success()
        working-directory: ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AIAssistant.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AIAssistant.ipa Payload

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-ipa
          path: ios/AIAssistant.ipa
          retention-days: 30
